name: Validate PR
description: >
  Universal PR validation: secrets check + build/lint/test
  for Node.js (package.json) or Python (pyproject.toml) projects.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '22'
  python-version:
    description: Python version
    required: false
    default: '3.13'
  pnpm-version:
    description: pnpm version
    required: false
    default: 'latest'
  lint-blocking:
    description: >-
      true = falha do lint (eslint/ruff) reprova o gate. O padrao false mantem o
      lint informativo (warning), como sempre foi.
    required: false
    default: 'false'
  strict-install:
    description: >-
      true = lockfile desatualizado reprova em vez de cair no install nao-frozen.
      O padrao false mantem o fallback com warning.
    required: false
    default: 'false'
  audit:
    description: >-
      true = executa auditoria de seguranca de dependencias (npm/pnpm/yarn/bun, Python, Go, Rust).
      Padrao true.
    required: false
    default: 'true'
  audit-level:
    description: >-
      Nivel minimo de severidade para auditoria (low, moderate, high, critical). Padrao high.
    required: false
    default: 'high'
  audit-blocking:
    description: >-
      true = vulnerabilidade encontrada reprova o gate. O padrao false emite warning informativo.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check for committed secrets (Basic)
      shell: bash
      run: |
        forbidden=$(git ls-files | grep -E '(^|\/)\.env$|(^|\/)\.env\.(local|production|prod|staging|dev)$|(^|\/)id_rsa$|(^|\/).+\.pem$|(^|\/).+\.key$' | grep -v -E '/(tests?|fixtures?|spec|examples?|mocks?)/' || true)
        if [ -n "$forbidden" ]; then
          echo "::error::Secret files tracked: $forbidden"
          exit 1
        fi
        echo "No committed secrets found."

    # Varredura de segredos pelo binario do Gitleaks (mesma action usada pelo
    # reusable-security-scan). O gitleaks-action@v3 era inutilizavel aqui: em
    # evento de pull_request ele chama GET /pulls/N/commits, que exige
    # `pull_requests: read`. Essa permissao nao cabe no teto de um caller com
    # token read-only, e sem ela o passo morre com 403 em repositorio privado --
    # publico passava so porque dados de PR publicos sao legiveis sem escopo.
    # O binario le o proprio git clonado e nao depende de API nem de permissao.
    # Intervalo vem do payload do evento, nao da API: em pull_request os SHAs de
    # base e head ja chegam prontos. Sem intervalo (dispatch, branch nova) cai no
    # historico completo. O gate olha a mudanca proposta; varrer o historico
    # inteiro aqui reprovaria todo PR de repositorio com divida antiga, que e
    # trabalho do reusable-security-scan.
    - name: Definir intervalo da varredura
      id: range
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        set -euo pipefail
        zero=0000000000000000000000000000000000000000
        range=""
        if [ "$EVENT" = pull_request ] && [ -n "${PR_BASE:-}" ]; then
          range="$PR_BASE..$PR_HEAD"
        elif [ "$EVENT" = push ] && [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$zero" ]; then
          range="$PUSH_BEFORE..$PUSH_AFTER"
        fi
        echo "log-opts=$range" >> "$GITHUB_OUTPUT"

    - name: Varredura de segredos
      uses: juninmd/base-actions/security-scan@main
      with:
        log-opts: ${{ steps.range.outputs.log-opts }}

    # ─── Version Detection ─────────────────────────────
    - name: Detect Runtime Versions
      id: detect
      shell: bash
      env:
        NODE_VERSION_INPUT: ${{ inputs.node-version }}
        PYTHON_VERSION_INPUT: ${{ inputs.python-version }}
      run: |
        NODE_VER="$NODE_VERSION_INPUT"
        PYTHON_VER="$PYTHON_VERSION_INPUT"
        if [ -f ".nvmrc" ]; then
          NODE_VER=$(tr -d 'v \n\r' < .nvmrc)
        elif [ -f ".node-version" ]; then
          NODE_VER=$(tr -d 'v \n\r' < .node-version)
        elif [ -f "package.json" ]; then
          if grep -q -E '"typescript":\s*"~2\.' package.json || grep -q -E '"@angular/core":\s*"4\.' package.json || grep -q -E '"@ionic/app-scripts"' package.json; then
            NODE_VER="10"
          fi
        fi
        if [ -f ".python-version" ]; then
          PYTHON_VER=$(tr -d ' \n\r' < .python-version)
        elif [ -f "requirements.txt" ] && grep -i -E "realtimetts|realtimestt|realtime-tts|coqui" requirements.txt >/dev/null; then
          PYTHON_VER="3.11"
        fi

        # gerenciador de pacotes: decidido uma vez aqui, os passos Node so leem
        PM=npm
        if [ -f "pnpm-lock.yaml" ]; then PM=pnpm
        elif [ -f "yarn.lock" ]; then PM=yarn
        elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then PM=bun
        fi
        # cache nativo do setup-node so para npm: pnpm/yarn precisam do binario
        # antes do setup-node, e o pnpm tem cache proprio mais abaixo
        NPM_CACHE=""
        if [ "$PM" = npm ] && [ -f "package-lock.json" ]; then NPM_CACHE=npm; fi

        {
          echo "NODE_VERSION_DETECTED=$NODE_VER"
          echo "PYTHON_VERSION_DETECTED=$PYTHON_VER"
        } >> "$GITHUB_ENV"
        {
          echo "pm=$PM"
          echo "npm-cache=$NPM_CACHE"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::Detected Node.js version: $NODE_VER (pm: $PM)"
        echo "::notice::Detected Python version: $PYTHON_VER"

    # ─── Node.js ──────────────────────────────────────
    - name: Setup Node.js
      if: hashFiles('package.json') != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ env.NODE_VERSION_DETECTED }}
        cache: ${{ steps.detect.outputs.npm-cache }}

    - name: Check packageManager field
      id: check-pm
      if: hashFiles('pnpm-lock.yaml') != ''
      shell: bash
      run: |
        if grep -q '"packageManager"' package.json 2>/dev/null; then
          echo "has-package-manager=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-package-manager=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup pnpm (legacy, via action)
      if: hashFiles('pnpm-lock.yaml') != '' && steps.check-pm.outputs.has-package-manager != 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}

    # Quando o package.json tem "packageManager", o pnpm/action-setup é pulado
    # (para evitar conflito de versão). Nesse caso o pnpm vem do corepack, que
    # precisa ser habilitado explicitamente — senão `pnpm` não existe (exit 127).
    - name: Enable corepack (packageManager field)
      if: hashFiles('pnpm-lock.yaml') != '' && steps.check-pm.outputs.has-package-manager == 'true'
      shell: bash
      run: corepack enable

    - name: Resolver store do pnpm
      id: pnpm-store
      if: hashFiles('pnpm-lock.yaml') != ''
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache do store do pnpm
      if: hashFiles('pnpm-lock.yaml') != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Setup Bun
      if: hashFiles('bun.lockb', 'bun.lock') != ''
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Install Node dependencies
      if: hashFiles('package.json') != ''
      shell: bash
      env:
        PM: ${{ steps.detect.outputs.pm }}
        STRICT_INSTALL: ${{ inputs.strict-install }}
      run: |
        set -uo pipefail
        # install estrito = lockfile desatualizado reprova; o padrao tolera (warning)
        # para nao quebrar quem ja depende do fallback
        fallback() {
          if [ "$STRICT_INSTALL" = "true" ]; then
            echo "::error::$1 desatualizado e strict-install=true"; exit 1
          fi
          echo "::warning::$1 desatualizado — fallback para install não-frozen"
        }
        case "$PM" in
          bun)
            bun install --frozen-lockfile || { fallback "bun.lock"; bun install; } ;;
          pnpm)
            # strictDepBuilds=false: build scripts não-revisados viram warning (não são executados), sem travar o gate (pnpm 10.3+)
            pnpm install --frozen-lockfile --config.strictDepBuilds=false || { fallback pnpm-lock.yaml; pnpm install --no-frozen-lockfile --config.strictDepBuilds=false; } ;;
          yarn)
            yarn install --frozen-lockfile || { fallback yarn.lock; yarn install; } ;;
          *)
            if [ -f "package-lock.json" ]; then
              npm ci --legacy-peer-deps || { fallback package-lock.json; npm install --legacy-peer-deps; }
            else
              npm install --legacy-peer-deps || npm install
            fi ;;
        esac

    - name: Build Node
      if: hashFiles('package.json') != ''
      shell: bash
      env:
        PM: ${{ steps.detect.outputs.pm }}
      run: |
        set -uo pipefail
        # --if-present so existe no `npm run`; para pnpm/yarn a checagem e explicita
        if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
          "$PM" run build
        else
          echo "::notice::Sem script \"build\" no package.json — etapa pulada"
        fi

    - name: Lint Node
      if: hashFiles('package.json') != ''
      shell: bash
      env:
        PM: ${{ steps.detect.outputs.pm }}
        LINT_BLOCKING: ${{ inputs.lint-blocking }}
      run: |
        set -uo pipefail
        if ! node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
          echo "::notice::Sem script \"lint\" no package.json — etapa pulada"; exit 0
        fi
        if "$PM" run lint; then exit 0; fi
        if [ "$LINT_BLOCKING" = "true" ]; then
          echo "::error::Lint falhou (lint-blocking=true)"; exit 1
        fi
        echo "::warning::Lint failed (non-blocking)"

    - name: Test Node
      if: hashFiles('package.json') != ''
      shell: bash
      env:
        PM: ${{ steps.detect.outputs.pm }}
      run: |
        # le o script direto do package.json: `npm test --if-present` nao e confiavel
        # (--if-present e flag de `npm run`) e o stub padrao do npm sai com erro.
        script=$(node -p "try{require('./package.json').scripts.test||''}catch(e){''}")
        if [ -z "$script" ]; then
          echo "::notice::Sem script \"test\" no package.json — etapa pulada"; exit 0
        fi
        case "$script" in
          *"no test specified"*|*"Write tests!"*)
            echo "::warning::Script de teste e o stub padrao — nenhum teste roda"; exit 0 ;;
        esac
        # Se o projeto usa Playwright, instala os binarios dos browsers se necessario
        if grep -q -E '"(@playwright/test|playwright)"' package.json 2>/dev/null; then
          echo "::notice::Detectado Playwright — instalando navegadores"
          npx playwright install --with-deps chromium 2>/dev/null || npx playwright install chromium 2>/dev/null || true
        fi
        "$PM" test

    - name: Audit Node dependencies
      if: inputs.audit == 'true' && hashFiles('package.json') != ''
      shell: bash
      env:
        PM: ${{ steps.detect.outputs.pm }}
        AUDIT_LEVEL: ${{ inputs.audit-level }}
        AUDIT_BLOCKING: ${{ inputs.audit-blocking }}
      run: |
        set -uo pipefail
        echo "::group::Auditando dependencias Node ($PM, nivel: $AUDIT_LEVEL)..."
        audit_failed=false

        case "$PM" in
          pnpm)
            if ! pnpm audit --audit-level "$AUDIT_LEVEL"; then
              audit_failed=true
            fi ;;
          yarn)
            if ! yarn audit --level "$AUDIT_LEVEL"; then
              audit_failed=true
            fi ;;
          bun)
            if bun audit --help >/dev/null 2>&1; then
              if ! bun audit; then audit_failed=true; fi
            elif [ -f "package-lock.json" ]; then
              if ! npm audit --audit-level="$AUDIT_LEVEL"; then audit_failed=true; fi
            else
              echo "::notice::Audit nativo nao disponivel para bun sem lockfile padrao"
            fi ;;
          *)
            if [ -f "package-lock.json" ]; then
              if ! npm audit --audit-level="$AUDIT_LEVEL"; then
                audit_failed=true
              fi
            else
              echo "::notice::package-lock.json ausente — pulando npm audit"
            fi ;;
        esac
        echo "::endgroup::"

        if [ "$audit_failed" = "true" ]; then
          if [ "$AUDIT_BLOCKING" = "true" ]; then
            echo "::error::Vulnerabilidades encontradas nas dependencias Node (nivel: $AUDIT_LEVEL, audit-blocking=true)"
            exit 1
          else
            echo "::warning::Vulnerabilidades encontradas nas dependencias Node (nivel: $AUDIT_LEVEL)"
          fi
        else
          echo "Audit de dependencias Node concluido sem vulnerabilidades >= $AUDIT_LEVEL"
        fi

    # ─── Python ───────────────────────────────────────
    - name: Setup uv
      if: hashFiles('pyproject.toml') != '' || hashFiles('uv.lock') != ''
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: ${{ env.PYTHON_VERSION_DETECTED }}

    - name: Setup Python
      if: (hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != '') && hashFiles('uv.lock') == ''
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ env.PYTHON_VERSION_DETECTED }}

    - name: Install Python dependencies
      if: hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != ''
      shell: bash
      run: |
        set -uo pipefail
        if [ -f "uv.lock" ]; then
          uv sync
        elif [ -f "pyproject.toml" ]; then
          # extras ausentes so geram aviso no pip; cada tentativa guarda a propria
          # saida e a ultima aparece inteira se nenhuma instalar (antes ia p/ /dev/null)
          last=""
          for target in '.[dev,test]' '.[dev]' '.'; do
            if last=$(pip install "$target" 2>&1); then
              echo "$last" | tail -n 3
              exit 0
            fi
            echo "::notice::pip install $target falhou — tentando a proxima opcao"
          done
          echo "$last"
          echo "::error::nao foi possivel instalar o projeto Python"
          exit 1
        elif [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi

    - name: Lint Python
      if: hashFiles('pyproject.toml') != '' || hashFiles('uv.lock') != ''
      shell: bash
      env:
        LINT_BLOCKING: ${{ inputs.lint-blocking }}
      run: |
        set -uo pipefail
        # lint e informativo por padrao (mesmo criterio do Node); lint-blocking=true reprova
        if [ -f "uv.lock" ]; then
          RUFF=(uv run ruff)
        else
          pip install --quiet ruff || { echo "::warning::ruff indisponivel"; exit 0; }
          RUFF=(ruff)
        fi
        if "${RUFF[@]}" check .; then exit 0; fi
        if [ "$LINT_BLOCKING" = "true" ]; then
          echo "::error::ruff reportou problemas (lint-blocking=true)"; exit 1
        fi
        echo "::warning::ruff reportou problemas (non-blocking)"

    - name: Test Python
      if: hashFiles('pyproject.toml') != '' || hashFiles('uv.lock') != ''
      shell: bash
      run: |
        set -o pipefail
        # ANTES: `pytest ... 2>/dev/null || echo "No tests found"` engolia QUALQUER
        # falha real de teste e o gate ficava verde. Agora: ausencia de testes e skip
        # explicito (exit 5 do pytest) e falha de teste derruba o job.
        # `--timeout` tambem saiu: exige o plugin pytest-timeout, que nao era instalado,
        # entao o pytest abortava com erro de uso e a mensagem sumia no /dev/null.
        if [ -f "uv.lock" ]; then
          RUNNER=(uv run pytest)
        else
          pip install --quiet pytest pytest-asyncio || { echo "::error::nao foi possivel instalar pytest — gate nao pode ser validado"; exit 1; }
          RUNNER=(python -m pytest)
        fi

        set +e
        "${RUNNER[@]}" -x -q
        ec=$?
        set -e
        case "$ec" in
          0) echo "✅ Testes Python passaram" ;;
          5) echo "::notice::Nenhum teste Python coletado — etapa pulada" ;;
          *) echo "::error::Testes Python falharam (pytest exit ${ec})"; exit "$ec" ;;
        esac

    - name: Audit Python dependencies
      if: inputs.audit == 'true' && (hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != '')
      shell: bash
      env:
        AUDIT_LEVEL: ${{ inputs.audit-level }}
        AUDIT_BLOCKING: ${{ inputs.audit-blocking }}
      run: |
        set -uo pipefail
        echo "::group::Auditando dependencias Python (nivel: $AUDIT_LEVEL)..."
        audit_failed=false

        if command -v uv >/dev/null 2>&1; then
          if ! uvx pip-audit --local 2>&1; then
            audit_failed=true
          fi
        elif command -v pip >/dev/null 2>&1; then
          pip install --quiet pip-audit || true
          if command -v pip-audit >/dev/null 2>&1; then
            if ! pip-audit --local 2>&1; then
              audit_failed=true
            fi
          fi
        fi
        echo "::endgroup::"

        if [ "$audit_failed" = "true" ]; then
          if [ "$AUDIT_BLOCKING" = "true" ]; then
            echo "::error::Vulnerabilidades encontradas nas dependencias Python (audit-blocking=true)"
            exit 1
          else
            echo "::warning::Vulnerabilidades encontradas nas dependencias Python"
          fi
        else
          echo "Audit de dependencias Python concluido sem vulnerabilidades conhecidas"
        fi

    # ─── Rust ─────────────────────────────────────────
    - name: Audit Rust dependencies
      if: inputs.audit == 'true' && hashFiles('Cargo.lock', 'Cargo.toml') != ''
      shell: bash
      env:
        AUDIT_BLOCKING: ${{ inputs.audit-blocking }}
      run: |
        set -uo pipefail
        if ! command -v cargo >/dev/null 2>&1; then
          echo "::notice::Cargo nao instalado no ambiente — etapa de audit pulada"
          exit 0
        fi
        echo "::group::Auditando dependencias Rust via cargo-audit..."
        audit_failed=false
        if ! command -v cargo-audit >/dev/null 2>&1; then
          cargo install cargo-audit --locked --quiet || true
        fi
        if command -v cargo-audit >/dev/null 2>&1; then
          if ! cargo audit; then
            audit_failed=true
          fi
        fi
        echo "::endgroup::"

        if [ "$audit_failed" = "true" ]; then
          if [ "$AUDIT_BLOCKING" = "true" ]; then
            echo "::error::Vulnerabilidades encontradas nas dependencias Rust (audit-blocking=true)"
            exit 1
          else
            echo "::warning::Vulnerabilidades encontradas nas dependencias Rust"
          fi
        else
          echo "Audit de dependencias Rust concluido"
        fi

    # ─── Go ───────────────────────────────────────────
    - name: Audit Go dependencies
      if: inputs.audit == 'true' && hashFiles('go.mod') != ''
      shell: bash
      env:
        AUDIT_BLOCKING: ${{ inputs.audit-blocking }}
      run: |
        set -uo pipefail
        if ! command -v go >/dev/null 2>&1; then
          echo "::notice::Go nao instalado no ambiente — etapa de audit pulada"
          exit 0
        fi
        echo "::group::Auditando dependencias Go via govulncheck..."
        audit_failed=false
        if ! go run golang.org/x/vuln/cmd/govulncheck@latest ./...; then
          audit_failed=true
        fi
        echo "::endgroup::"

        if [ "$audit_failed" = "true" ]; then
          if [ "$AUDIT_BLOCKING" = "true" ]; then
            echo "::error::Vulnerabilidades encontradas nas dependencias Go (audit-blocking=true)"
            exit 1
          else
            echo "::warning::Vulnerabilidades encontradas nas dependencias Go"
          fi
        else
          echo "Audit de dependencias Go concluido"
        fi

    # ─── Helm / K8s ───────────────────────────────────
    - name: Install Helm
      if: hashFiles('**/Chart.yaml') != ''
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

    - name: Lint Helm Charts
      if: hashFiles('**/Chart.yaml') != ''
      shell: bash
      run: |
        find . -name "Chart.yaml" -not -path "*/charts/*" -exec dirname {} \; | while read -r chart; do
          echo "Linting chart: $chart"
          helm lint "$chart"
          helm template "$chart" > /dev/null
        done
