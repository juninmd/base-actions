# Global allowlist additions: built artifacts, sourcemaps, demos, fixture keys
[[allowlists]]
description = "Artefatos compilados (VitePress, vite chunks, sourcemaps e libs)"
paths = [
  '''(?i)\.vitepress/(?:dist|cache)/''',
  '''(?i)\.(?:min\.js|map|html)$''',
  '''(?i)\.md\.[A-Za-z0-9_-]{6,}\.js$''',
  '''(?i)(?:^|/)(?:static/libs|chunks)/''',
  '''(?i)\.env[-_]sample$''',
  # Fixtures do scanner tokenix: PEM/pubkey de teste e strings de baixa entropia
  '''(?i)/(?:secrets_scan|conversation_audit)\.rs$''',
]

[[allowlists]]
description = "data: URI de sourcemap/base64 embutidos em bundles"
regexTarget = "secret"
regexes = [
  '''(?i)data:[\w.-]+/[\w.-]+;base64,[A-Za-z0-9+/=]{40,}''',
]

