# Configuração central de Gitleaks dos projetos @juninmd.
#
# Estende o ruleset padrão do Gitleaks e acrescenta as regras que pegam o que o
# padrão deixa passar: credencial de banco escrita direto no código, connect
# string de Oracle, URI com usuário:senha, host interno corporativo, token
# Authorization hardcoded e formatos de API key que o padrão ainda não cobre
# (Gemini AQ.Ab, OpenRouter, Groq, xAI e Google OAuth client secret).
#
# Cada regra abaixo nasceu de um vazamento real encontrado nos repositórios —
# não são padrões hipotéticos. Ver testdata/ para o corpus que prova cada uma.
#
# Gitleaks usa RE2 (Go): não existe lookahead nem lookbehind. Placeholder é
# filtrado por `stopwords` e `allowlists`, nunca por regex negativo.

title = "juninmd base ruleset"

[extend]
useDefault = true

# ─────────────────────────────────────────────────────────────────────
# Senha literal em código ou config
#
# Pega: password: 'Y3!tGUlG4Et@TR**Mpu@XwmbfpvceP6S'
#       password      : "!usr_pagdesp1!"
#       "senha": "..."
# ─────────────────────────────────────────────────────────────────────
[[rules]]
id = "juninmd-hardcoded-password"
description = "Senha literal atribuida no codigo (nao vem de variavel de ambiente)"
regex = '''(?i)["']?(?:password|passwd|pwd|senha|db_pass)["']?\s*[:=]\s*["']?([^"'\n]{6,80})["']?'''
secretGroup = 1
keywords = ["password", "passwd", "pwd", "senha", "db_pass"]
tags = ["password", "juninmd"]

  [[rules.allowlists]]
  description = "Placeholders, referencias a env e valores de exemplo"
  regexTarget = "secret"
  regexes = [
    '''(?i)^\$?\{?\s*(?:process\.env|os\.environ|env|secrets|vault|config)[.\[]''',
    '''^\$\{[^}]*\}$''',
    '''^\$\{\{.*\}\}$''',
    '''^\$[A-Za-z_][A-Za-z0-9_]*$''',
    '''^\w+:\$[A-Za-z_][A-Za-z0-9_]*$''',
    ''':char:''',
    '''\.\./''',
    '''\s''',
    '''\(''',
    '''\)''',
    '''\{''',
    '''\}''',
    '''\[''',
    '''\]''',
    '''^<[^>]*>$''',
    '''^%[A-Za-z_]+%$''',
    '''^\*+$''',
    '''^x+$''',
    '''^\.+$''',
  ]
  stopwords = [
    "your", "yours", "example", "exemplo", "changeme", "change_me",
    "placeholder", "dummy", "sample", "redacted", "xxxxxx", "123456",
    "password", "passwd", "senha", "secret", "hunter2", "s3cr3t",
    "todo", "fixme", "notset", "none", "null", "undefined", "empty",
    # Saida de parser/relatorio: `password = "Not Found"` nao e credencial.
    
    # TS/Rust declaracoes e atribuicoes de codigo, nao segredos.
    "string", "number", "boolean", "any", "Trigger",
    # Fixtures de compose/ci e variaveis locais
    "postgres", "mysql", "localhost", "homolog", "mock", "demo", "sample",
    "not-needed", "vibe-session", "fatec123", "radar_ci", "meubarbeiro",
    "litellm-local", "not-needed",
  ]

  [[rules.allowlists]]
  description = "Testes, fixtures, exemplos e lockfiles"
  paths = [
    '''(?i)(^|/)(tests?|specs?|__tests__|fixtures?|mocks?|examples?|samples?)/''',
    '''(?i)(^|/)[^/]*\.(?:test|spec)\.[a-z]+$''',
    '''(?i)(^|/)(?:package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lock|bun\.lockb|composer\.lock|Cargo\.lock|uv\.lock|poetry\.lock|Gemfile\.lock|go\.sum)$''',
    '''(?i)(^|/)\.env\.(?:example|sample|template|dist)$''',
    # Arquivos de traducao: a chave `password`/`senha` e um rotulo de UI
    # ("Contrasena", "Mot de passe"), nunca uma credencial. Sem isto, cada
    # idioma do app gera um falso positivo por string traduzida.
    '''(?i)(^|/)(?:i18n|locale|locales|lang|translations|messages)/''',
  ]

# ─────────────────────────────────────────────────────────────────────
# Connect string de Oracle
#
# Pega: connectString : "dbpkg.app.example.intranet:1578/APP"
# ─────────────────────────────────────────────────────────────────────
[[rules]]
id = "juninmd-oracle-connect-string"
description = "Connect string de Oracle apontando para um host real"
regex = '''(?i)connect(?:ion)?string\s*[:=]\s*["']([a-z0-9][a-z0-9.\-]*(?::\d{2,5})?/[A-Za-z0-9_]+)["']'''
secretGroup = 1
keywords = ["connectstring", "connectionstring"]
tags = ["database", "juninmd"]

  [[rules.allowlists]]
  description = "Bancos locais e de teste"
  regexTarget = "secret"
  regexes = [
    '''(?i)^(?:localhost|127\.0\.0\.1|0\.0\.0\.0|host\.docker\.internal|db|database|oracle|oracledb)(?::\d+)?/''',
  ]

# ─────────────────────────────────────────────────────────────────────
# URI de conexão com credencial embutida
#
# Pega: mysql://user:senha@host:3306/db, postgres://, mongodb+srv://, amqp://
# ─────────────────────────────────────────────────────────────────────
[[rules]]
id = "juninmd-db-uri-credentials"
description = "URI de conexao com usuario e senha embutidos"
regex = '''(?i)\b(?:mysql|mariadb|postgres(?:ql)?|mongodb(?:\+srv)?|redis|rediss|amqps?|ftp|mssql|clickhouse)://[^\s:/@'"]+:([^\s/'"]{3,})@[^\s/'"]+'''
secretGroup = 1
keywords = ["mysql://", "mariadb://", "postgres", "mongodb", "redis://", "rediss://", "amqp://", "amqps://", "ftp://", "mssql://", "clickhouse://"]
tags = ["database", "credentials", "juninmd"]

  [[rules.allowlists]]
  description = "Credenciais triviais de ambiente local"
  regexTarget = "line"
  regexes = [
    '''(?i)@(?:localhost|127\.0\.0\.1|0\.0\.0\.0|host\.docker\.internal|postgres|mysql|db|database|mongodb|redis|amqp|mq|nosql|celertty|\$\{|%)''',
  ]

  [[rules.allowlists]]
  description = "Senha vinda de variavel de ambiente"
  regexTarget = "secret"
  regexes = [
    '''(?i)^\$?\{?\s*(?:process\.env|os\.environ|env|secrets)[.\[]''',
    '''^\$[A-Za-z_][A-Za-z0-9_]*$''',
    '''^\$\{[^}]*\}$''',
  ]
  stopwords = ["password", "senha", "example", "changeme", "user", "root:root"]

# ─────────────────────────────────────────────────────────────────────
# Host interno corporativo
#
# Pega: dbpkg.app.example.intranet
#       algum-servico.example.corp
# Exige pelo menos dois rotulos antes do sufixo, senao `.env.local` e afins
# viram falso positivo em massa. `.local` fica de fora de proposito: mDNS e
# nome de arquivo usam demais.
# ─────────────────────────────────────────────────────────────────────
[[rules]]
id = "juninmd-internal-hostname"
description = "Hostname de rede interna corporativa exposto no codigo"
regex = '''\b([a-z0-9][a-z0-9\-]{1,62}\.[a-z0-9][a-z0-9\-]{1,62}\.(?:intranet|corp|internal|lan))\b'''
secretGroup = 1
keywords = ["intranet", ".corp", ".internal", ".lan"]
tags = ["infrastructure", "juninmd"]

  [[rules.allowlists]]
  description = "Dominios internos publicos de ferramentas conhecidas"
  regexTarget = "secret"
  regexes = [
    '''(?i)\.(?:svc\.cluster\.local|cluster\.internal)$''',
    '''(?i)^(?:registry|packages|proxy)\.(?:npmjs|docker|github)\.''',
    # Endpoint de metadados de cloud: hostname fixo e publico, nao topologia
    # privada. Citado em qualquer guard de SSRF (GCP/AWS metadata).
    '''(?i)^metadata\.google\.internal$''',
    '''(?i)^169\.254\.169\.254$''',
    # Dominios reservados para documentacao e teste (RFC 2606): nunca resolvem
    # para uma rede real, entao nao revelam topologia.
    '''(?i)^[a-z0-9.\-]*\.example\.(?:com|org|net|corp|internal|lan)$''',
    '''(?i)^[a-z0-9.\-]*\.[a-z0-9.\-]*\.example\.(?:com|org|net)$''',
    # Nomes de PROPRIEDADE do Ant/NetBeans terminam em `.internal` e nao sao
    # hostnames (ap.supported.internal, proc.none.internal, cmd.line.internal).
    # Aparecem em todo build-impl.xml gerado pela IDE.
    '''(?i)^(?:ap|proc|cmd|javac|j2ee|jar|test|src|native)\.(?:[a-z0-9_]+\.)*[a-z0-9_]+$''',
    # Namespaces de codigo (pacotes Kotlin/Java, identificadores do editor e
    # chaves de internacionalizacao) terminam em `.internal` sem serem
    # hostnames: kotlinx.coroutines.internal, meta.supported.internal,
    # web.extension.internal, com.foo.internal.
    '''(?i)^(?:kotlinx?|java|javax|jakarta|com|org|io|dev|net|node|npm|gradle|androidx?|vscode|microsoft|github|web|meta|ap|proc|cmd|src|app|lib|core|internal)\.(?:[a-z0-9_]+\.)*[a-z0-9_]+$''',
  ]

  [[rules.allowlists]]
  description = "Metadados gerados pela IDE (nao escritos a mao)"
  paths = [
    '''(?i)(^|/)nbproject/''',
  ]

# ─────────────────────────────────────────────────────────────────────
# Endpoint de RDS da AWS
#
# Pega: fakeapp-staging.ab12cd34ef56.us-east-1.rds.amazonaws.com
# Sozinho nao e uma senha, mas revela topologia e, na pratica, aparece
# colado na credencial.
# ─────────────────────────────────────────────────────────────────────
[[rules]]
id = "juninmd-aws-rds-endpoint"
description = "Endpoint de banco gerenciado da AWS exposto no codigo"
regex = '''\b([a-z0-9\-]+\.[a-z0-9]{12,}\.[a-z]{2}-[a-z]+-\d\.(?:rds|redshift|cache)\.amazonaws\.com)\b'''
secretGroup = 1
keywords = ["rds.amazonaws.com", "redshift.amazonaws.com", "cache.amazonaws.com"]
tags = ["infrastructure", "aws", "juninmd"]

# ─────────────────────────────────────────────────────────────────────
# Authorization hardcoded
#
# Pega: Bearer ZDE3ZjkzMGI5NjU4MWUzOThjYWMwZTMyZWMxMjRjZmE=
#       Authorization: Basic dXNlcjpwYXNz
# ─────────────────────────────────────────────────────────────────────
[[rules]]
id = "juninmd-authorization-header"
description = "Token Bearer ou Basic escrito direto no codigo"
regex = '''(?i)\b(?:bearer|basic)\s+([A-Za-z0-9+/=_\-]{20,})'''
secretGroup = 1
entropy = 3.5
keywords = ["bearer", "basic"]
tags = ["token", "juninmd"]

  [[rules.allowlists]]
  description = "Interpolacao, placeholder e exemplos da documentacao"
  regexTarget = "line"
  regexes = [
    '''(?i)(?:process\.env|os\.environ|secrets\.|\$\{|<token>|<your|YOUR_TOKEN|xxxx)''',
  ]
  stopwords = ["example", "exemplo", "placeholder", "token_here", "abcdef", "changeme"]

# ─────────────────────────────────────────────────────────────────────
# Google Gemini Auth key (formato novo)
#
# Pega: AQ.Ab8RN6FakeFixtureForGitleaks0123456789
# O Google AI Studio passou a emitir chaves `AQ.Ab...` (Auth key) no lugar
# das `AIza...` (Standard key). A regra `gcp-api-key` do ruleset padrao so
# conhece AIza, entao sem esta regra a chave nova passa inteira.
#
# Formato real: 53 caracteres (`AQ.Ab` + 48 base64url). O detector oficial do
# Google (osv-scalibr) exige `AQ.Ab8R`; aqui o ancora e `AQ.Ab` + 30 ou mais
# para nao perder chaves com outro marcador de versao nem copias truncadas em
# log/print (o valor completo no texto original costuma vir cortado).
# Ref: https://ai.google.dev/gemini-api/docs/api-key
#      https://github.com/google/osv-scalibr/blob/main/veles/secrets/gcpexpressmode/detector.go
#      https://github.com/trufflesecurity/trufflehog/pull/5440
# ─────────────────────────────────────────────────────────────────────
[[rules]]
id = "juninmd-google-gemini-auth-key"
description = "Chave de autenticacao do Google Gemini no formato AQ.Ab..."
regex = '''\b(AQ\.Ab[A-Za-z0-9_\-]{30,})(?:[^A-Za-z0-9_\-]|$)'''
secretGroup = 1
keywords = ["aq.ab"]
tags = ["api-key", "google", "gemini", "juninmd"]

  [[rules.allowlists]]
  description = "Placeholders, valores de exemplo e interpolacao"
  regexTarget = "secret"
  regexes = [
    '''(?i)^AQ\.Ab(?:x{8,}|\*{8,}|example|placeholder|your|fake|dummy)$''',
  ]
  stopwords = ["example", "exemplo", "placeholder", "your", "fake", "dummy"]

# ─────────────────────────────────────────────────────────────────────
# Chaves de API de provedores de IA ainda ausentes do ruleset padrao
#
# OpenRouter: sk-or-v1- + 64 hex
# Groq:       gsk_ + 48 a 52 alfanumericos
# xAI/Grok:   xai- + 80 alfanumericos
#
# Groq aceita 48 e 52 porque o PR aberto no gitleaks usa 48 e o detector do
# TruffleHog usa 52; as duas larguras ja foram emitidas pela Groq.
# Ref: https://github.com/gitleaks/gitleaks/pull/2181
#      https://github.com/gitleaks/gitleaks/pull/2310
#      https://github.com/gitleaks/gitleaks/issues/2309
#      https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/groq/groq.go
# ─────────────────────────────────────────────────────────────────────
[[rules]]
id = "juninmd-openrouter-api-key"
description = "Chave de API do OpenRouter (sk-or-v1-...)"
regex = '''\b(sk-or-v1-[a-f0-9]{64})(?:[^A-Za-z0-9]|$)'''
secretGroup = 1
keywords = ["sk-or-v1-"]
tags = ["api-key", "openrouter", "juninmd"]

  [[rules.allowlists]]
  description = "Placeholders e valores de exemplo"
  regexTarget = "secret"
  regexes = [
    '''(?i)^sk-or-v1-(?:x{8,}|0{8,}|example|placeholder)$''',
  ]
  stopwords = ["example", "exemplo", "placeholder", "your", "fake", "dummy"]

[[rules]]
id = "juninmd-groq-api-key"
description = "Chave de API da Groq (gsk_...)"
regex = '''\b(gsk_[A-Za-z0-9]{48,52})(?:[^A-Za-z0-9]|$)'''
secretGroup = 1
keywords = ["gsk_"]
tags = ["api-key", "groq", "juninmd"]

  [[rules.allowlists]]
  description = "Placeholders e valores de exemplo"
  regexTarget = "secret"
  regexes = [
    '''(?i)^gsk_(?:x{8,}|0{8,}|example|placeholder)$''',
  ]
  stopwords = ["example", "exemplo", "placeholder", "your", "fake", "dummy"]

[[rules]]
id = "juninmd-xai-api-key"
description = "Chave de API da xAI/Grok (xai-...)"
regex = '''\b(xai-[A-Za-z0-9]{80})(?:[^A-Za-z0-9]|$)'''
secretGroup = 1
keywords = ["xai-"]
tags = ["api-key", "xai", "juninmd"]

  [[rules.allowlists]]
  description = "Placeholders e valores de exemplo"
  regexTarget = "secret"
  regexes = [
    '''(?i)^xai-(?:x{8,}|0{8,}|example|placeholder)$''',
  ]
  stopwords = ["example", "exemplo", "placeholder", "your", "fake", "dummy"]

# ─────────────────────────────────────────────────────────────────────
# Google OAuth client secret
#
# Pega: GOCSPX-...
# O ruleset padrao cobre o client ID (`*.apps.googleusercontent.com`) e o
# access token (`ya29.`), mas nao o client secret emitido pelo Google Cloud.
# ─────────────────────────────────────────────────────────────────────
[[rules]]
id = "juninmd-google-oauth-client-secret"
description = "Client secret do Google OAuth (GOCSPX-...)"
regex = '''\b(GOCSPX-[A-Za-z0-9_\-]{20,})(?:[^A-Za-z0-9_\-]|$)'''
secretGroup = 1
keywords = ["gocspx-"]
tags = ["api-key", "google", "oauth", "juninmd"]

  [[rules.allowlists]]
  description = "Placeholders e valores de exemplo"
  regexTarget = "secret"
  regexes = [
    '''(?i)^GOCSPX-(?:x{8,}|0{8,}|example|placeholder)''',
  ]
  stopwords = ["example", "exemplo", "placeholder", "your", "fake", "dummy"]

# ─────────────────────────────────────────────────────────────────────
# Padrões incorporados do tokenix e do TruffleHog
#
# Fontes:
#   https://github.com/juninmd/tokenix/blob/main/assets/secret-rules/default.toml
#   https://github.com/trufflesecurity/trufflehog/tree/main/pkg/detectors
#   https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
#
# Só entram aqui os formatos que o ruleset padrão do Gitleaks (222 regras)
# ainda não cobre. Prefixos específicos dispensam contexto; os poucos casos
# contextuais usam entropia ou uma palavra-chave próxima para evitar FP.
# ─────────────────────────────────────────────────────────────────────

# --- Cloud / infraestrutura ------------------------------------------------

[[rules]]
id = "juninmd-aws-access-key-id-extra"
description = "AWS access key ID com prefixos que o ruleset padrao nao cobre"
regex = '''\b((?:AGPA|AIDA|AROA|AIPA|ANPA|ANVA)[A-Z0-9]{16})\b'''
secretGroup = 1
entropy = 3
keywords = ["agpa", "aida", "aroa", "aipa", "anpa", "anva"]
tags = ["aws", "api-key", "juninmd"]

[[rules]]
id = "juninmd-aws-secret-access-key"
description = "AWS secret access key atribuida no codigo"
regex = '''(?i)aws_?secret_?(?:access_?)?key["' ]?\s*[:=]\s*["']?([A-Za-z0-9/+]{40})'''
secretGroup = 1
entropy = 4.0
keywords = ["aws_secret", "secret_access_key"]
tags = ["aws", "secret", "juninmd"]

  [[rules.allowlists]]
  description = "Placeholders e exemplos"
  regexTarget = "secret"
  regexes = [
    '''(?i)^(?:x+|0+|example|placeholder|your|fake)''',
  ]
  stopwords = ["example", "exemplo", "placeholder", "your", "fake", "dummy"]

[[rules]]
id = "juninmd-azure-storage-account-key"
description = "AccountKey de Azure Storage embutida em connection string"
regex = '''(?i)AccountKey=([A-Za-z0-9+/]{86}==)'''
secretGroup = 1
keywords = ["accountkey"]
tags = ["azure", "storage", "juninmd"]

[[rules]]
id = "juninmd-digitalocean-token-v1"
description = "Token v1 da DigitalOcean com prefixo dot_ (nao coberto pelo padrao)"
regex = '''\b(dot_v1_[0-9a-f]{64})\b'''
secretGroup = 1
keywords = ["dot_v1_"]
tags = ["digitalocean", "api-key", "juninmd"]

[[rules]]
id = "juninmd-vault-token"
description = "Token do HashiCorp Vault (service, batch ou recovery)"
regex = '''\b(hv[sbr]\.[0-9A-Za-z_-]{20,})\b'''
secretGroup = 1
keywords = ["hvs.", "hvb.", "hvr."]
tags = ["vault", "token", "juninmd"]

# --- Pagamentos / comercio -------------------------------------------------

[[rules]]
id = "juninmd-stripe-webhook-secret"
description = "Webhook signing secret do Stripe"
regex = '''\b(whsec_[0-9A-Za-z]{32,})\b'''
secretGroup = 1
keywords = ["whsec_"]
tags = ["stripe", "webhook", "juninmd"]

[[rules]]
id = "juninmd-paypal-braintree-token"
description = "Access token de producao do PayPal Braintree"
regex = '''\b(access_token\$production\$[0-9a-z]{16}\$[0-9a-f]{32})\b'''
secretGroup = 1
keywords = ["access_token$production$"]
tags = ["paypal", "braintree", "token", "juninmd"]

[[rules]]
id = "juninmd-razorpay-key"
description = "Chave de API do Razorpay (live ou test)"
regex = '''(?i)\b(rzp_(?:live|test)_[A-Za-z0-9]{14})\b'''
secretGroup = 1
keywords = ["rzp_live_", "rzp_test_"]
tags = ["razorpay", "api-key", "juninmd"]

[[rules]]
id = "juninmd-paystack-key"
description = "Secret key do Paystack (live ou test)"
regex = '''\b(sk_[a-z]+_[A-Za-z0-9]{40})\b'''
secretGroup = 1
keywords = ["sk_live_", "sk_test_"]
tags = ["paystack", "api-key", "juninmd"]

[[rules]]
id = "juninmd-pagarme-key"
description = "Chave de API live do Pagar.me"
regex = '''\b(ak_live_[a-zA-Z0-9]{30})\b'''
secretGroup = 1
keywords = ["ak_live_"]
tags = ["pagarme", "api-key", "juninmd"]

# --- Comunicacao -----------------------------------------------------------

[[rules]]
id = "juninmd-discord-bot-token"
description = "Token de bot do Discord"
regex = '''\b([MNO][A-Za-z0-9_-]{23,25}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,})\b'''
secretGroup = 1
tags = ["discord", "token", "juninmd"]

[[rules]]
id = "juninmd-discord-webhook"
description = "Webhook do Discord com token embutido"
regex = '''(https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+)'''
secretGroup = 1
keywords = ["discord.com/api/webhooks", "discordapp.com/api/webhooks"]
tags = ["discord", "webhook", "juninmd"]

[[rules]]
id = "juninmd-resend-api-key"
description = "Chave de API do Resend"
regex = '''\b(re_[1-9A-HJ-NP-Za-km-z]{8}_[1-9A-HJ-NP-Za-km-z]{24})\b'''
secretGroup = 1
keywords = ["re_"]
tags = ["resend", "api-key", "juninmd"]

# --- Pacotes / registries --------------------------------------------------

[[rules]]
id = "juninmd-docker-hub-pat"
description = "Personal access token do Docker Hub"
regex = '''\b(dckr_pat_[0-9A-Za-z_-]{27,}|dckr_oat_[0-9A-Za-z_-]{32})\b'''
secretGroup = 1
keywords = ["dckr_pat_", "dckr_oat_"]
tags = ["docker", "token", "juninmd"]

[[rules]]
id = "juninmd-buildkite-token"
description = "Token de agente/API do Buildkite"
regex = '''\b(bkua_[a-z0-9]{40})\b'''
secretGroup = 1
keywords = ["bkua_"]
tags = ["buildkite", "token", "juninmd"]

# --- Observabilidade / SaaS ------------------------------------------------

[[rules]]
id = "juninmd-sonarcloud-token"
description = "Token do SonarCloud no formato sqco_"
regex = '''\b(sqco_[0-9A-Za-z]{59})\b'''
secretGroup = 1
keywords = ["sqco_"]
tags = ["sonar", "token", "juninmd"]

[[rules]]
id = "juninmd-newrelic-license-key"
description = "License key do New Relic"
# Chave de 40 caracteres: 36 alfanumericos (conta/regiao + hex) e o sufixo
# literal NRAL. O tokenix traz {40} antes do NRAL, o que daria 44 e nao casa
# com nenhuma chave real emitida.
regex = '''\b([0-9a-z]{36}NRAL)\b'''
secretGroup = 1
keywords = ["nral"]
tags = ["newrelic", "license", "juninmd"]

[[rules]]
id = "juninmd-sentry-dsn"
description = "DSN do Sentry com chave publica embutida"
regex = '''(https://[0-9a-f]{32}@[0-9a-z.-]+/[0-9]+)'''
secretGroup = 1
keywords = ["sentry"]
tags = ["sentry", "dsn", "juninmd"]

# --- Banco / BaaS ----------------------------------------------------------

[[rules]]
id = "juninmd-supabase-pat"
description = "Personal access token do Supabase"
regex = '''\b(sbp_[0-9a-z]{40})\b'''
secretGroup = 1
keywords = ["sbp_"]
tags = ["supabase", "token", "juninmd"]

[[rules]]
id = "juninmd-firebase-cloud-messaging-key"
description = "Chave legada do Firebase Cloud Messaging"
