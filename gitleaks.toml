# ─────────────────────────────────────────────────────────────────────
# Allowlist global
# ─────────────────────────────────────────────────────────────────────
# O corpus em testdata/leaky/ e detectado de proposito — e o que prova que as
# regras funcionam. Ele NAO e allowlistado aqui, porque allowlist de path casa
# com o caminho completo e silenciaria tambem a suite de teste. A supressao
# fica no .gitleaksignore deste repositorio, por fingerprint.

[[allowlists]]
description = "Binarios, dependencias vendorizadas e artefatos de build"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)vendor/''',
  '''(^|/)\.venv/''',
  '''(^|/)(?:dist|build|out|target)/''',
  '''(?i)\.(?:png|jpe?g|gif|ico|svg|pdf|zip|gz|tgz|woff2?|ttf|eot|exe|dll|so|dylib|class|jar|wasm|min\.js|map)$''',
]

[[allowlists]]
description = "Hashes (sha256/sha1/md5) nao sao credenciais"
regexTarget = "secret"
regexes = [
  # Relatorio de integridade de fontes gera um hash por arquivo; o
  # generic-api-key lia a string hex como chave. No ecos-de-baia-cinzenta
  # isso sozinho rendia 122 achados.
  '''(?i)^[0-9a-f]{40}$''',
  '''(?i)^[0-9a-f]{64}$''',
  '''(?i)^sha(?:1|256|512)-[A-Za-z0-9+/=]{16,}$''',
]


# ─────────────────────────────────────────────────────────────────────────────
# Allowlist global (vale para o ruleset padrao E para as regras custom)
#
# As allowlists dentro de [[rules.allowlists]] so valem para a regra que as
# declara. Sem esta secao, as regras padrao do Gitleaks (generic-api-key,
# private-key, github-pat, ...) acusam fixtures de teste, documentacao,
# notebooks, binarios e lockfiles em todo o historico - o que mantinha o job
# de PR vermelho em repositorios antigos.
# ─────────────────────────────────────────────────────────────────────────────
[[allowlists]]
description = "Falsos positivos estruturais: testes, docs, notebooks, binarios, lockfiles e metadados"
paths = [
  '''(?i)(^|/)(tests?|specs?|__tests__|__mocks__|fixtures?|mocks?|examples?|samples?)/''',
  '''(?i)(^|/)[^/]*\.(test|spec)\.[a-z0-9]+$''',
  '''(?i)\.(md|mdx|rst|ipynb)$''',
  '''(?i)\.(mp3|wav|ogg|flac|png|jpe?g|gif|webp|ico|svg|zip|gz|tgz|tar|pdf|ttf|woff2?|pyc|class|jar)$''',
  '''(?i)(^|/)search_index\.json$''',
  '''(?i)(^|/)[^/]*\.enc\.ya?ml$''',
  '''(?i)(^|/)\.gitleaksignore$''',
  '''(?i)(^|/)\.env\.(?:example|sample|dist|template)$''',
  # "exemplo" em portugues: mesma semantica de examples/samples.
  '''(?i)(^|/)exemplos?/''',
  # Artefatos de cobertura e export do Sonar: saida de ferramenta, nao codigo.
  '''(?i)(^|/)(?:lcov-report|coverage)/''',
  '''(?i)(^|/)(?:full_cov|coverage|test_output)(?:[^/]*)\.(?:txt|json|html)$''',
  '''(?i)(^|/)sonar_issues\.json$''',
  '''(?i)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lock|bun\.lockb|composer\.lock|Cargo\.lock|uv\.lock|poetry\.lock|Gemfile\.lock|go\.sum)$''',
]
regexes = [
  # Metadado do Backstage/catalog-info, nao e credencial.
  '''(?i)sonarqube\.org/project-key:\s*\S+''',
]