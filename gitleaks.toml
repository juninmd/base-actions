# ---------------------------------------------------------------------
# Fallback para credenciais atribuidas a variaveis de ambiente
#
# Cobre valores opacos que nao tem prefixo publico conhecido, mas cujo
# proprio nome da variavel declara que e token/api key/secret/session/cookie.
# O match inteiro (nome + valor) evita que a allowlist global de hash 40/64
# hex silencie chaves como GITHUB_CLIENT_SECRET e VIRUSTOTAL_API_KEY.
# ---------------------------------------------------------------------
[[rules]]
id = "juninmd-env-secret-assignment"
description = "Credencial atribuida a variavel de ambiente explicita (token/api key/secret/session/cookie)"
regex = '''(?i)\b(?:[A-Z0-9]+_)*(?:TOKEN|API_KEY|SECRET|ACCESS_KEY|CLIENT_SECRET|API_HASH|SESSION|COOKIES)\s*[:=]\s*["']?[A-Za-z0-9_\-\.+/=:]{20,}(?:["']|\s|$)'''
entropy = 3.0
keywords = ["token", "api_key", "secret", "access_key", "client_secret", "api_hash", "session", "cookies"]
tags = ["env", "secret", "juninmd"]

  [[rules.allowlists]]
  description = "Placeholders, referencias a ambiente e exemplos"
  regexTarget = "match"
  regexes = [
    '''(?i)(?:process\.env|os\.environ|settings\.|\$\{|<[^>]+>|%[A-Z_]+%)''',
    # Valor inteiro e uma leitura de ambiente (env.X, Bun.env.X), nao um literal:
    # `token: env.MY_APP_TOKEN || ''` fechava 20 chars e disparava a regra.
    '''(?i)[:=]\s*["']?(?:bun\.)?env\.[A-Z_][A-Z0-9_]*["']?\s*$''',
    '''(?i)(?:example|exemplo|placeholder|changeme|change_me|dummy|sample|redacted|your[_-])''',
    '''(?i)(?:x{8,}|0{8,}|\*{6,})''',
    '''\(''',
    '''\)''',
    '''\{''',
    '''\}''',
    '''\[''',
    '''\]''',
  ]
  stopwords = [
    "example", "exemplo", "placeholder", "your", "changeme", "change_me",
    "dummy", "sample", "redacted", "existing", "virtual", "1234",
    # Referencia a runtime/config, nao e um literal de segredo.
    "config.", "import.meta.env", "resolved.", "options.", "publishingAccount",
    "not-needed", "biometricsgrpc", "hardwareservice", "vibe-",
    "api_keys.", "local-homolog", "mock-", "mock_", "-local",
  ]

[[rules]]
id = "juninmd-bcrypt-password-hash"
description = "Hash bcrypt de senha exposto em configuracao"
regex = '''(\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53})\b'''
secretGroup = 1
keywords = ["$2a$", "$2b$", "$2y$"]
tags = ["password", "hash", "juninmd"]

[[rules]]
id = "juninmd-youtube-cookies"
