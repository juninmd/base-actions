name: Security Scan
description: Varredura de segredos no historico completo com Gitleaks

inputs:
  gitleaks-version:
    description: Versao fixada do Gitleaks. Mesma usada em test-gitleaks-config.yml.
    required: false
    default: '8.30.1'
  fail-on-findings:
    description: Falha o job quando encontrar segredo. Desligue apenas para inventario.
    required: false
    default: 'true'
  log-opts:
    description: >
      Intervalo git a varrer, no formato "base..head". Vazio varre o historico
      completo. O gate de PR manda o intervalo do proprio PR; a varredura de
      historico do reusable-security-scan deixa vazio.
    required: false
    default: ''

outputs:
  findings:
    description: Quantidade de ocorrencias encontradas
    value: ${{ steps.scan.outputs.total }}

runs:
  using: composite
  steps:
    # O binario e baixado uma vez por versao e reaproveitado nas execucoes
    # seguintes, evitando um download de release a cada job.
    - name: Restaurar Gitleaks do cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/gitleaks-bin
        key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ inputs.gitleaks-version }}

    # Roda sempre e decide pelo binario, nao pelo cache-hit: se uma execucao
    # anterior falhar no meio do download, o cache guarda um diretorio vazio e
    # confiar no cache-hit deixaria todas as execucoes seguintes sem gitleaks.
    - name: Instalar Gitleaks
      shell: bash
      env:
        VERSION: ${{ inputs.gitleaks-version }}
        ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        dest="$RUNNER_TEMP/gitleaks-bin"

        if [ -x "$dest/gitleaks" ] && "$dest/gitleaks" version 2>/dev/null | grep -qx "$VERSION"; then
          echo "::notice::Gitleaks $VERSION reaproveitado do cache"
          exit 0
        fi
        rm -rf "$dest"

        case "$ARCH" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::Arquitetura nao suportada pelo Gitleaks: $ARCH"; exit 1 ;;
        esac

        work="$(mktemp -d)"
        base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
        tarball="gitleaks_${VERSION}_linux_${arch}.tar.gz"
        checksums="gitleaks_${VERSION}_checksums.txt"

        curl -sSfL --retry 3 --retry-delay 2 -o "$work/$tarball" "$base/$tarball"
        curl -sSfL --retry 3 --retry-delay 2 -o "$work/$checksums" "$base/$checksums"

        # Ferramenta de seguranca sem verificacao de integridade vira vetor de
        # supply chain: confere o release contra o checksum publicado.
        ( cd "$work" && grep " $tarball\$" "$checksums" | sha256sum -c - )

        tar -xzf "$work/$tarball" -C "$work" gitleaks
        chmod +x "$work/gitleaks"
        "$work/gitleaks" version

        # So publica o diretorio depois do binario pronto e validado, para nunca
        # deixar um estado parcial no caminho que sera cacheado.
        mkdir -p "$dest"
        mv "$work/gitleaks" "$dest/gitleaks"
        rm -rf "$work"

    - name: Publicar Gitleaks no PATH
      shell: bash
      run: echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

    # O Gitleaks so enxerga config dentro do workspace do repo escaneado, entao a
    # config central e copiada pra ca. Config propria do repo sempre vence.
    - name: Resolver config do Gitleaks
      id: cfg
      shell: bash
      run: |
        set -euo pipefail
        if [ -f .gitleaks.toml ]; then
          cfg=.gitleaks.toml
          echo "::notice::Usando .gitleaks.toml do proprio repositorio"
        elif [ -f gitleaks.toml ]; then
          cfg=gitleaks.toml
          echo "::notice::Usando gitleaks.toml do proprio repositorio"
        else
          cp "${{ github.action_path }}/../gitleaks.toml" .gitleaks-base.toml
          cfg=.gitleaks-base.toml
          echo "::notice::Usando o ruleset central do base-actions"
        fi
        echo "path=$cfg" >> "$GITHUB_OUTPUT"

    - name: Varrer historico completo
      id: scan
      shell: bash
      env:
        CONFIG: ${{ steps.cfg.outputs.path }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        LOG_OPTS: ${{ inputs.log-opts }}
      run: |
        set -uo pipefail
        gitleaks version
        report="$RUNNER_TEMP/gitleaks-report.json"

        # --redact impede que o segredo apareca no log publico do job.
        # --exit-code 0 devolve o controle da falha para ca, permitindo resumir
        # os achados antes de encerrar.
        # Sem intervalo varre o historico inteiro; com intervalo olha so os commits
        # do PR ou do push. Um gate de PR que reprova por segredo antigo do
        # repositorio nao diz nada sobre a mudanca proposta e trava todo mundo.
        range_args=""
        if [ -n "${LOG_OPTS:-}" ]; then
          echo "::notice::Varredura incremental: $LOG_OPTS"
          range_args="--log-opts=$LOG_OPTS"
        else
          echo "::notice::Varredura do historico completo"
        fi

        gitleaks detect \
          --source . \
          --config "$CONFIG" \
          --report-format json \
          --report-path "$report" \
          --redact \
          --no-banner \
          --exit-code 0 $range_args
        status=$?
        if [ $status -ne 0 ]; then
          echo "::error::Gitleaks falhou ao executar (codigo $status)"
          exit $status
        fi

        [ -s "$report" ] || echo '[]' > "$report"
        total=$(jq 'length' "$report")
        echo "total=$total" >> "$GITHUB_OUTPUT"

        if [ "$total" -eq 0 ]; then
          echo "### Gitleaks: nenhum segredo encontrado" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # O resumo diz onde esta o vazamento, nunca o valor.
        {
          echo "### Gitleaks: $total ocorrencia(s)"
          echo ""
          echo "| Regra | Arquivo | Linha | Commit |"
          echo "| --- | --- | --- | --- |"
          jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \((.Commit // "")[0:8]) |"' "$report"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$FAIL_ON_FINDINGS" = "true" ]; then
          echo "::error::Gitleaks encontrou $total ocorrencia(s). Detalhes no resumo do job."
          exit 1
        fi

    - name: Remover config temporaria
      if: always()
      shell: bash
      run: rm -f .gitleaks-base.toml
