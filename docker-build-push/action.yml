name: Docker Build & Push
description: Build and push Docker image to GHCR

inputs:
  image-name:
    description: Image name (e.g. owner/repo)
    required: true
  github-token:
    description: GitHub token for GHCR login
    required: true
  context:
    description: Build context
    required: false
    default: '.'
  file:
    description: Dockerfile path
    required: false
    default: ''
  build-args:
    description: Newline-separated build args
    required: false
    default: ''
  push:
    description: Push the image (false = build only, para PRs)
    required: false
    default: 'true'
  provenance:
    description: >-
      Attestation de proveniencia (SLSA). Ligado por padrao pelo buildx e mantido
      assim: e a procedencia das imagens de ~140 repos. Desligue apenas se o
      consumidor nao entender OCI image index.
    required: false
    default: 'true'
  sbom:
    description: Attestation de SBOM. O padrao do buildx e desligado.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ inputs.image-name }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,format=long,prefix=

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        # scope por repo+workflow: evita que repos diferentes disputem a mesma
        # entrada de cache do GHA (limite de 10GB por repositório)
        cache-from: type=gha,scope=${{ github.workflow }}
        cache-to: type=gha,scope=${{ github.workflow }},mode=max
        provenance: ${{ inputs.provenance }}
        sbom: ${{ inputs.sbom }}
