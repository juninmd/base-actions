name: Reusable PR Labeler

on:
  workflow_call:
    inputs:
      configuration-path:
        description: Caminho para o arquivo de configuracao do labeler
        type: string
        required: false
        default: '.github/labeler.yml'
      sync-labels:
        description: Se deve remover labels que nao correspondem mais aos arquivos
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          repo-token: ${{ github.token }}
          configuration-path: ${{ inputs.configuration-path }}
          sync-labels: ${{ inputs.sync-labels }}
