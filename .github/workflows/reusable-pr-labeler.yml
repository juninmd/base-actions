name: Reusable PR Labeler

on:
  workflow_call:
    inputs:
      configuration-path:
        description: Caminho para o arquivo de configuracao do labeler
        type: string
        required: false
        default: '.github/labeler.yml'
      sync-labels:
        description: Se deve remover labels que nao correspondem mais aos arquivos
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ github.token }}
          configuration-path: ${{ inputs.configuration-path }}
          sync-labels: ${{ inputs.sync-labels }}
