name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.7
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757

jobs:
  lint:
    name: Lint workflows & actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 140+ repos consomem este repo via @main: um YAML invalido aqui quebra todos
      # de uma vez. Este job e o unico gate antes disso.
      # Binario pinado + checksum: sem container rodando como root sobre o workspace
      # (git "dubious ownership") e sem tag flutuante na cadeia de suprimentos.
      - name: actionlint (.github/workflows)
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --status
          tar -xzf "$tarball" actionlint
          ./actionlint -color
          rm -f actionlint "$tarball"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # actionlint ignora action.yml -- e ali que vive quase todo o shell do repo.
      # Com CI setado, shellcheck ausente vira erro: um terco do linter nao pode
      # sumir em silencio por mudanca de imagem do runner.
      - name: Lint composite actions (schema + injecao + shellcheck)
        run: |
          shellcheck --version
          pip install --quiet pyyaml
          python .github/scripts/lint-actions.py

  # O bug que este repo mais repetiu foi startup_failure em reusable workflow: o run
  # morre sem job e sem anotacao, entao o gate PARECE existir e nunca roda. Chamar o
  # proprio reusable a partir do CI reproduz isso na hora. Cobre `with:` e
  # `permissions:` invalidos no nivel de workflow -- NAO prova que os inputs chegam
  # na action, porque o reusable resolve validate-pr@main e nao a versao desta
  # branch; essa prova e o job `inputs-honored` abaixo.
  call-reusable-validate:
    name: Smoke - reusable-validate resolve (guarda de startup_failure)
    needs: lint
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-validate.yml
    with:
      # deliberadamente != default ('22') do reusable: com valor igual ao default,
      # apagar o bloco `with:` de la deixaria este job verde e o bug voltaria calado.
      node-version: '20'

  gitleaks-contract:
    name: Contrato do ruleset de secrets
    needs: lint
    permissions:
      contents: read
    uses: ./.github/workflows/test-gitleaks-config.yml

  smoke-actions:
    name: Smoke - actions sem stack detectada
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # validate-pr pelo caminho local ja e coberto por test-validate-pr-branch.yml
      - name: deploy-to-argocd sem token deve pular, nao falhar
        uses: ./deploy-to-argocd
        with:
          app-name: smoke-test

  smoke-node:
    name: Smoke - projeto Node (${{ matrix.pm }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pnpm + campo packageManager e o caminho mais fragil (corepack x PATH)
        # e era o unico sem cobertura -- foi onde nasceram os ultimos bugs.
        pm: [npm, pnpm]
    steps:
      # fetch-depth: 0 e obrigatorio -- validate-pr varre segredos no intervalo do
      # PR lendo o git local; num clone raso o SHA da base nao existe e o gitleaks
      # aborta com "bad object".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Montar fixture ${{ matrix.pm }}
        env:
          PM: ${{ matrix.pm }}
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {
            "name": "base-actions-fixture",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "ms": "2.1.3" },
            "scripts": {
              "build": "node -e \"console.log('build ok')\"",
              "lint": "node -e \"console.log('lint ok')\"",
              "test": "node -e \"console.log('test ok')\""
            }
          }
          JSON
          if [ "$PM" = "pnpm" ]; then
            npm pkg set packageManager="pnpm@10.15.0"
            corepack enable
            pnpm install --lockfile-only
            # sem lockfile o validate-pr cai no caminho npm e esta perna nao prova nada
            [ -f pnpm-lock.yaml ] || { echo "::error::fixture pnpm nao gerou pnpm-lock.yaml"; exit 1; }
          else
            npm install --package-lock-only --no-audit --no-fund
            [ -f package-lock.json ] || { echo "::error::fixture npm nao gerou package-lock.json"; exit 1; }
          fi

      - uses: ./validate-pr
        with:
          node-version: '22'

  inputs-honored:
    name: Smoke - node-version e realmente aplicado
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fixture minimo
        run: |
          set -euo pipefail
          echo '{"name":"v","version":"1.0.0","private":true,"scripts":{}}' > package.json
          npm install --package-lock-only --no-audit --no-fund

      # o input so vale se chegar no actions/setup-node. Foi exatamente isso que
      # ficou quebrado em silencio enquanto o reusable-validate nao repassava `with:`.
      - uses: ./validate-pr
        with:
          node-version: '20'

      - name: Exigir Node 20 ativo
        run: |
          set -euo pipefail
          actual=$(node -v)
          echo "node -v = $actual"
          case "$actual" in
            v20.*) echo "node-version foi respeitado" ;;
            *) echo "::error::pedi node-version 20 e o runner esta em $actual"; exit 1 ;;
          esac

  smoke-gate:
    name: Smoke - teste vermelho DEVE derrubar o validate-pr
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # controle: mesmo fixture, teste verde. Separa "falhou pelo teste" de
      # "falhou por infra" (npm quebrado, setup-node, varredura de segredos...).
      - name: Fixture de controle (teste verde)
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {
            "name": "gate-control", "version": "1.0.0", "private": true,
            "scripts": { "test": "node -e \"process.exit(0)\"" }
          }
          JSON
          npm install --package-lock-only --no-audit --no-fund

      - id: control
        continue-on-error: true
        uses: ./validate-pr

      - name: Trocar por fixture com teste vermelho
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); p.scripts.test='node -e \"process.exit(1)\"'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2))"
          cat package.json

      - id: red
        continue-on-error: true
        uses: ./validate-pr

      - name: Assercao do gate
        env:
          CONTROL: ${{ steps.control.outcome }}
          RED: ${{ steps.red.outcome }}
        run: |
          echo "controle=$CONTROL  vermelho=$RED"
          if [ "$CONTROL" != "success" ]; then
            echo "::error::fixture de controle falhou -- a assercao abaixo nao prova nada (problema de infra)"
            exit 1
          fi
          if [ "$RED" != "failure" ]; then
            echo "::error::validate-pr passou com um teste vermelho -- o gate esta furado"
            exit 1
          fi
          echo "gate correto: verde passa, vermelho derruba"
