name: Test Gitleaks Config

on:
  push:
    paths:
      - 'gitleaks.toml'
      - 'testdata/**'
      - '.github/workflows/test-gitleaks-config.yml'
  pull_request:
    paths:
      - 'gitleaks.toml'
      - 'testdata/**'
      - '.github/workflows/test-gitleaks-config.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks
          rm -f "$tarball" checksums.txt
          gitleaks version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      # Falha se alguma regra parar de pegar o vazamento, ou se alguma
      # comecar a acusar placeholder.
      - name: Assert ruleset
        run: python testdata/assert.py gitleaks
