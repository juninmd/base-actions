name: Reusable PR Validation
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '22'
      python-version:
        type: string
        required: false
        default: '3.13'
      pnpm-version:
        type: string
        required: false
        default: 'latest'
      lint-blocking:
        type: boolean
        required: false
        default: false
        description: 'true = falha do lint reprova o gate (padrao: so warning).'
      strict-install:
        type: boolean
        required: false
        default: false
        description: 'true = lockfile desatualizado reprova em vez de cair no install nao-frozen.'
      audit:
        type: boolean
        required: false
        default: true
        description: 'true = executa auditoria de seguranca de dependencias (npm/pnpm/yarn/bun, Python, Go, Rust).'
      audit-level:
        type: string
        required: false
        default: 'high'
        description: 'Nivel minimo de severidade para auditoria (low, moderate, high, critical).'
      audit-blocking:
        type: boolean
        required: false
        default: false
        description: 'true = vulnerabilidade reprova o gate. false = aviso informativo (warning).'
      persist-credentials:
        type: boolean
        required: false
        default: false
        description: >-
          Manter o header de auth do checkout no .git/config. Default false: o
          validate-pr instala as dependencias do PR, e um postinstall malicioso
          leria esse header para usar o GITHUB_TOKEN (contents: read) do job.
          Ligue apenas se o repositorio tem dependencia `git+https://github.com/...`
          privada que precisa da credencial durante o install.

# Sem `concurrency` aqui de proposito. Num workflow chamado, `github.workflow` e o
# nome do workflow do CHAMADOR, entao dois jobs do mesmo caller invocando este
# reusable cairiam no mesmo grupo e um cancelaria o outro -- o cancelado reporta
# `cancelled` e trava o merge como required check, sem log explicando nada.
# Politica de concorrencia e do caller.

jobs:
  validate:
    # Nao peca permissao alem de `contents: read`. Um workflow chamado herda o
    # teto do caller, e em repositorio com default do GITHUB_TOKEN "read-only" o
    # teto e contents+packages: read. Pedir `pull-requests` derruba o run inteiro
    # com startup_failure -- sem job e sem anotacao, entao o gate parece existir
    # e nunca roda. Coberto por test-restricted-token.yml.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 e obrigatorio -- a varredura de segredos do validate-pr le
      # o intervalo do PR direto do git clonado, sem API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: ${{ inputs.persist-credentials }}
      # O `with:` foi removido em 0ad778c como tentativa as cegas durante a cacada
      # ao startup_failure; a causa real era a permissao `pull-requests` (d3adc12).
      # Sem ele os tres inputs acima eram aceitos e silenciosamente ignorados --
      # quem passava node-version: '18' rodava no 22.
      # Cobertura, sendo honesto sobre o limite: `inputs-honored` no CI assere
      # `node -v` depois de rodar ./validate-pr, ou seja, prova que a ACTION honra
      # o input. `call-reusable-validate` prova que ESTE workflow nao da
      # startup_failure e passa um valor nao-default. O elo final -- o `with:`
      # daqui chegando na action -- so e observavel depois do merge, porque a
      # linha abaixo resolve validate-pr@main e nao a versao da branch.
      - uses: juninmd/base-actions/validate-pr@main
        with:
          node-version: ${{ inputs.node-version }}
          python-version: ${{ inputs.python-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          lint-blocking: ${{ inputs.lint-blocking }}
          strict-install: ${{ inputs.strict-install }}
          audit: ${{ inputs.audit }}
          audit-level: ${{ inputs.audit-level }}
          audit-blocking: ${{ inputs.audit-blocking }}
