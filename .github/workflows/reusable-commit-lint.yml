name: Commit Lint

on:
  workflow_call:

# contents: read cabe em qualquer teto de caller (inclusive token read-only).
jobs:
  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Install commitlint
        run: |
          pnpm add -g @commitlint/cli @commitlint/config-conventional

      - name: Run commitlint
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Lint all commits in the PR or the last commit on push
          if [ "$EVENT" = "pull_request" ]; then
            npx commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          else
            npx commitlint --from HEAD~1 --to HEAD --verbose
          fi
