name: Release & Tagging

on:
  workflow_call:
    inputs:
      branch:
        description: 'Target branch for tagging'
        required: false
        type: string
        default: 'main'
      versioning:
        description: "'date' (padrao, vYYYY.MM.DD-sha) ou 'semver' (vX.Y.Z a partir de Conventional Commits)"
        required: false
        type: string
        default: 'date'
      generate-release:
        description: 'Whether to generate a GitHub release'
        required: false
        type: boolean
        default: true
    secrets:
      GH_TOKEN:
        description: 'Personal Access Token'
        required: false

# Sem `permissions:` de proposito: este job precisa de contents: write, e declarar
# isso num workflow chamado estoura o teto de um caller com token read-only
# (startup_failure). Quem chama concede `contents: write` no proprio job.
# Dois pushes seguidos na branch geram tags no mesmo segundo; serializa.
concurrency:
  group: release-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == format('refs/heads/{0}', inputs.branch)
    steps:
      # a credencial fica no clone de proposito: o passo de tag da push com ela.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag generation
        id: tagger
        env:
          VERSIONING: ${{ inputs.versioning }}
        run: |
          set -euo pipefail
          if [ "$VERSIONING" = "semver" ]; then
            # Bump pelo maior tipo desde a ultima tag vX.Y.Z: BREAKING/! = major, feat = minor, resto = patch.
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            range=${last:+$last..}HEAD
            subjects=$(git log "$range" --format='%s%n%b')
            IFS=. read -r maj min pat <<< "${last#v}"
            maj=${maj:-0}; min=${min:-0}; pat=${pat:-0}
            if echo "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE'; then maj=$((maj+1)); min=0; pat=0
            elif echo "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then min=$((min+1)); pat=0
            else pat=$((pat+1)); fi
            TAG_NAME="v${maj}.${min}.${pat}"
          else
            TAG_NAME="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create Release
        if: ${{ inputs.generate-release }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.tagger.outputs.tag_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
