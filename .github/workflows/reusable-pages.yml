name: Reusable GitHub Pages Deploy

on:
  workflow_call:
    inputs:
      build-command:
        description: Comando opcional para build caso nao seja gerado antes
        type: string
        required: false
        default: ''
      artifact-path:
        description: Diretorio onde estao os arquivos estaticos gerados
        type: string
        required: false
        default: 'dist'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build custom
        if: inputs.build-command != ''
        env:
          CMD: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          eval "$CMD"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ inputs.artifact-path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
