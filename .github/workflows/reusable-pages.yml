name: Reusable GitHub Pages Deploy

on:
  workflow_call:
    inputs:
      build-command:
        description: Comando opcional para build caso nao seja gerado antes
        type: string
        required: false
        default: ''
      artifact-path:
        description: Diretorio onde estao os arquivos estaticos gerados
        type: string
        required: false
        default: 'dist'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build custom
        if: inputs.build-command != ''
        env:
          CMD: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          eval "$CMD"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.artifact-path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
