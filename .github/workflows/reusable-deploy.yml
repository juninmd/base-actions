name: Reusable Deployment

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      image-tag:
        type: string
        required: false
        default: latest
      argocd-server:
        type: string
        required: false
        default: argocd.antonio-code.duckdns.org
      require-token:
        type: boolean
        required: false
        default: false
        description: 'true = ARGOCD_AUTH_TOKEN ausente reprova (padrao: pula com warning).'
      force:
        type: boolean
        required: false
        default: false
      prune:
        type: boolean
        required: false
        default: false
      wait-timeout:
        type: number
        required: false
        default: 0
        description: 'Segundos esperando Synced/Healthy depois do sync (0 = nao espera).'
    secrets:
      ARGOCD_AUTH_TOKEN:
        required: false

# Deploy nunca é cancelado no meio; apenas serializa por app.
concurrency:
  group: deploy-${{ inputs.app-name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # sem checkout: a composite action é baixada direto do base-actions e não lê o repo do chamador
      - uses: juninmd/base-actions/deploy-to-argocd@main
        with:
          app-name: ${{ inputs.app-name }}
          image-tag: ${{ inputs.image-tag }}
          argocd-server: ${{ inputs.argocd-server }}
          argocd-token: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          require-token: ${{ inputs.require-token }}
          force: ${{ inputs.force }}
          prune: ${{ inputs.prune }}
          wait-timeout: ${{ inputs.wait-timeout }}
