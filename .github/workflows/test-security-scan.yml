name: Test Security Scan Action

# Roda a action do proprio branch (./security-scan), nao a de @main, para que a
# alteracao seja provada antes de virar main. O repositorio tem corpus vazado
# proposital em testdata/leaky/, suprimido por fingerprint no .gitleaksignore:
# se a supressao ou a action quebrarem, este teste fica vermelho.
on:
  push:
    paths:
      - 'security-scan/**'
      - 'gitleaks.toml'
      - '.gitleaksignore'
      - '.github/workflows/reusable-security-scan.yml'
      - '.github/workflows/test-security-scan.yml'
  pull_request:
    paths:
      - 'security-scan/**'
      - 'gitleaks.toml'
      - '.gitleaksignore'
      - '.github/workflows/reusable-security-scan.yml'
      - '.github/workflows/test-security-scan.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  scan-self:
    name: Varre o proprio repositorio
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./security-scan

  detects-planted-secret:
    name: Prova que um segredo novo e barrado
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Sem esta prova, um scan quebrado passaria despercebido: nao encontrar
      # nada pareceria sucesso.
      # O segredo e gerado na hora, e nao escrito aqui, para o proprio arquivo de
      # teste nao virar um vazamento commitado no repositorio.
      - name: Plantar segredo nao suprimido
        run: |
          set -euo pipefail
          mkdir -p .security-scan-probe
          printf 'password: "%s"\n' "$(openssl rand -base64 24 | tr -d '\n=')" > .security-scan-probe/config.yml
          git -c user.email=ci@example.com -c user.name=ci add -f .security-scan-probe/config.yml
          git -c user.email=ci@example.com -c user.name=ci commit -q -m 'test: segredo plantado para o teste do scan'

      - id: probe
        uses: ./security-scan
        continue-on-error: true
        with:
          fail-on-findings: 'true'

      # Falhar nao basta: a action tambem falha se o download quebrar. O teste so
      # vale se ela falhou por ter encontrado o segredo.
      - name: Exigir reprovacao por achado
        env:
          OUTCOME: ${{ steps.probe.outcome }}
          FINDINGS: ${{ steps.probe.outputs.findings }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::O scan passou com um segredo plantado no historico. A varredura nao esta funcionando."
            exit 1
          fi
          if [ -z "$FINDINGS" ] || [ "$FINDINGS" -lt 1 ]; then
            echo "::error::O scan falhou sem reportar achado (findings='$FINDINGS'). Falhou por erro de execucao, nao por deteccao."
            exit 1
          fi
          echo "Scan barrou o segredo plantado: $FINDINGS achado(s), como esperado."
