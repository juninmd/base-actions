name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['fix', 'bug']
  - title: '🛡️ Security'
    labels: ['security']
  - title: '⬆️ Dependencies'
    labels: ['dependencies']
  - title: '🧹 Maintenance'
    labels: ['chore', 'refactor', 'ci', 'docs']
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
exclude-labels: ['skip-changelog']
version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['minor', 'feature', 'enhancement']
  patch:
    labels: ['patch', 'fix', 'bug', 'dependencies']
  default: patch

# Sem autolabeler nenhum PR recebe label => todas as categorias saem vazias e
# o version-resolver cai sempre no default. Deriva a label do título (conventional commit).
autolabeler:
  - label: 'feature'
    title: ['/^feat(\(.+\))?!?:/i']
  - label: 'fix'
    title: ['/^fix(\(.+\))?!?:/i']
  - label: 'security'
    title: ['/^(sec|security)(\(.+\))?!?:/i']
  - label: 'dependencies'
    title: ['/^(chore\(deps\)|build\(deps\)|deps)/i']
  - label: 'docs'
    title: ['/^docs(\(.+\))?:/i']
  - label: 'ci'
    title: ['/^ci(\(.+\))?:/i']
  - label: 'refactor'
    title: ['/^refactor(\(.+\))?:/i']
  - label: 'chore'
    title: ['/^chore(?!\(deps\))(\(.+\))?:/i']
  - label: 'breaking'
    title: ['/^\w+(\(.+\))?!:/']

template: |
  ## Changes

  $CHANGES
