name: 'Setup Ollama with Model'
description: 'Instala Ollama, inicia o serviço, configura cache e puxa o modelo'

inputs:
  model:
    description: 'Nome do modelo Ollama a usar (ex: gemma3:1b)'
    required: true
  ollama-host:
    description: 'Host do Ollama (padrão: http://localhost:11434)'
    required: false
    default: 'http://localhost:11434'
  wait-timeout:
    description: 'Timeout máximo para Ollama ficar pronto, em segundos'
    required: false
    default: '180'
  pull-timeout:
    description: 'Timeout máximo para fazer pull do modelo, em minutos'
    required: false
    default: '15'
  cache-enabled:
    description: 'Habilitar cache de modelos (true/false)'
    required: false
    default: 'true'

outputs:
  model-cached:
    description: 'Booleano indicando se modelo veio do cache'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'

  steps:
    - name: Ollama Models Cache
      if: inputs.cache-enabled == 'true'
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.ollama/models
        key: ollama-models-${{ runner.os }}-${{ inputs.model }}
        restore-keys: |
          ollama-models-${{ runner.os }}-

    - name: Install and Start Ollama
      shell: bash
      env:
        OLLAMA_HOST: ${{ inputs.ollama-host }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
      run: |
        set -euo pipefail
        echo "📥 Instalando Ollama..."
        curl -fsSL https://ollama.com/install.sh | sh

        # o install.sh sobe um systemd unit rodando como usuário `ollama`, cujos modelos
        # vão para /usr/share/ollama/.ollama/models — fora do path cacheado, e a porta
        # ocupada fazia o nosso `ollama serve` morrer em silêncio. Derruba e assume.
        sudo systemctl stop ollama 2>/dev/null || true
        sudo systemctl disable ollama 2>/dev/null || true

        export OLLAMA_MODELS="$HOME/.ollama/models"
        mkdir -p "$OLLAMA_MODELS"
        echo "OLLAMA_MODELS=$OLLAMA_MODELS" >> "$GITHUB_ENV"
        echo "OLLAMA_HOST=$OLLAMA_HOST" >> "$GITHUB_ENV"

        echo "🚀 Iniciando serviço Ollama em $OLLAMA_HOST (modelos em $OLLAMA_MODELS)..."
        nohup ollama serve > /tmp/ollama.log 2>&1 &

        echo "⏳ Aguardando Ollama estar pronto (máximo ${WAIT_TIMEOUT}s)..."
        if ! timeout "$WAIT_TIMEOUT" bash -c 'until curl -sf "$OLLAMA_HOST/api/tags" >/dev/null; do sleep 1; done'; then
          echo "::error::Timeout: Ollama não respondeu em ${WAIT_TIMEOUT}s"
          cat /tmp/ollama.log
          exit 1
        fi
        echo "✅ Ollama está pronto!"

    - name: Pull Ollama Model
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        PULL_TIMEOUT_MIN: ${{ inputs.pull-timeout }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        # cache-hit não garante que ESTE modelo está lá (restore-keys traz cache parcial)
        # `ollama pull llama3` guarda como `llama3:latest`, entao comparar com o nome
        # cru nunca casa. Normaliza a tag e compara exato na 1a coluna, com -F para
        # o `.` de nomes como llama3.2 nao virar curinga.
        case "$MODEL" in *:*) WANT="$MODEL" ;; *) WANT="$MODEL:latest" ;; esac
        installed() { ollama list | awk 'NR>1{print $1}' | grep -qxF "$WANT"; }
        if installed; then
          echo "📦 Modelo $WANT recuperado do cache (cache-hit=${CACHE_HIT:-false})"
        else
          echo "📥 Puxando modelo $MODEL (timeout: ${PULL_TIMEOUT_MIN}m)..."
          timeout "$(( PULL_TIMEOUT_MIN * 60 ))" ollama pull "$MODEL"
        fi

        echo "📋 Verificando disponibilidade:"
        if ! installed; then
          echo "::error::Modelo $WANT não encontrado após o pull."
          ollama list
          exit 1
        fi
        echo "✅ Setup concluído com sucesso!"
