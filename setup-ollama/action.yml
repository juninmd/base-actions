name: 'Setup Ollama with Model'
description: 'Instala Ollama, inicia o serviço, configura cache e puxa o modelo'

inputs:
  version:
    description: >-
      Versao do Ollama (sem o "v"). Baixada do release oficial e conferida contra o
      sha256sum.txt publicado, no lugar do `curl | sh` do install.sh.
    required: false
    default: '0.40.6'
  model:
    description: 'Nome do modelo Ollama a usar (ex: gemma3:1b)'
    required: true
  ollama-host:
    description: 'Host do Ollama (padrão: http://localhost:11434)'
    required: false
    default: 'http://localhost:11434'
  wait-timeout:
    description: 'Timeout máximo para Ollama ficar pronto, em segundos'
    required: false
    default: '180'
  pull-timeout:
    description: 'Timeout máximo para fazer pull do modelo, em minutos'
    required: false
    default: '15'
  cache-enabled:
    description: 'Habilitar cache de modelos (true/false)'
    required: false
    default: 'true'

outputs:
  model-cached:
    description: 'Booleano indicando se modelo veio do cache'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'

  steps:
    - name: Validar plataforma
      shell: bash
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        if [ "$RUNNER_OS_NAME" != "Linux" ]; then
          echo "::error::setup-ollama so suporta runners Linux (recebido: $RUNNER_OS_NAME)"
          exit 1
        fi

    # v1 no prefixo: muda o layout do cache sem herdar entradas incompativeis
    - name: Ollama Models Cache
      if: inputs.cache-enabled == 'true'
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ollama/models
        key: ollama-models-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.model }}
        restore-keys: |
          ollama-models-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Install and Start Ollama
      shell: bash
      env:
        OLLAMA_HOST: ${{ inputs.ollama-host }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        VERSION: ${{ inputs.version }}
        ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        case "$ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::Arquitetura nao suportada pelo Ollama: $ARCH"; exit 1 ;;
        esac

        # Binario do release oficial, conferido contra o checksum publicado no mesmo
        # release. O install.sh (`curl | sh`) rodava como root sem verificar nada e
        # sempre pegava a versao mais nova, o que tornava o CI nao reproduzivel.
        echo "📥 Instalando Ollama ${VERSION} (${arch})..."
        work="$(mktemp -d)"
        base="https://github.com/ollama/ollama/releases/download/v${VERSION}"
        tarball="ollama-linux-${arch}.tar.zst"
        curl -sSfL --retry 3 --retry-delay 2 -o "$work/$tarball" "$base/$tarball"
        curl -sSfL --retry 3 --retry-delay 2 -o "$work/sha256sum.txt" "$base/sha256sum.txt"
        # o arquivo lista os nomes como ./nome
        ( cd "$work" && awk -v t="./$tarball" '$2 == t' sha256sum.txt | sha256sum -c - )
        sudo tar -C /usr --zstd -xf "$work/$tarball"
        rm -rf "$work"
        ollama --version

        # sem o systemd unit do install.sh nao ha servico concorrente: o `ollama serve`
        # abaixo e o unico dono da porta e do diretorio de modelos
        export OLLAMA_MODELS="$HOME/.ollama/models"
        mkdir -p "$OLLAMA_MODELS"
        echo "OLLAMA_MODELS=$OLLAMA_MODELS" >> "$GITHUB_ENV"
        echo "OLLAMA_HOST=$OLLAMA_HOST" >> "$GITHUB_ENV"

        log="$RUNNER_TEMP/ollama.log"
        echo "🚀 Iniciando serviço Ollama em $OLLAMA_HOST (modelos em $OLLAMA_MODELS)..."
        nohup ollama serve > "$log" 2>&1 &

        echo "⏳ Aguardando Ollama estar pronto (máximo ${WAIT_TIMEOUT}s)..."
        if ! timeout "$WAIT_TIMEOUT" bash -c 'until curl -sf "$OLLAMA_HOST/api/tags" >/dev/null; do sleep 1; done'; then
          echo "::error::Timeout: Ollama não respondeu em ${WAIT_TIMEOUT}s"
          cat "$log"
          exit 1
        fi
        echo "✅ Ollama está pronto!"

    - name: Pull Ollama Model
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        PULL_TIMEOUT_MIN: ${{ inputs.pull-timeout }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        # cache-hit não garante que ESTE modelo está lá (restore-keys traz cache parcial)
        # `ollama pull llama3` guarda como `llama3:latest`, entao comparar com o nome
        # cru nunca casa. Normaliza a tag e compara exato na 1a coluna, com -F para
        # o `.` de nomes como llama3.2 nao virar curinga.
        case "$MODEL" in *:*) WANT="$MODEL" ;; *) WANT="$MODEL:latest" ;; esac
        installed() { ollama list | awk 'NR>1{print $1}' | grep -qxF "$WANT"; }
        if installed; then
          echo "📦 Modelo $WANT recuperado do cache (cache-hit=${CACHE_HIT:-false})"
        else
          echo "📥 Puxando modelo $MODEL (timeout: ${PULL_TIMEOUT_MIN}m)..."
          timeout "$(( PULL_TIMEOUT_MIN * 60 ))" ollama pull "$MODEL"
        fi

        echo "📋 Verificando disponibilidade:"
        if ! installed; then
          echo "::error::Modelo $WANT não encontrado após o pull."
          ollama list
          exit 1
        fi
        echo "✅ Setup concluído com sucesso!"
