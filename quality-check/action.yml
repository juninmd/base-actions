name: 'Quality Check'
description: 'Roda Lint, Testes e valida cobertura de código'

inputs:
  node-version:
    description: 'Versão do Node.js'
    required: false
    default: '22'
  run-lint:
    description: 'Se deve rodar o lint'
    required: false
    default: 'true'
  run-test:
    description: 'Se deve rodar os testes'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Setup Node & PNPM
      # caminho relativo em composite action resolve no workspace do CHAMADOR — precisa ser absoluto
      uses: juninmd/base-actions/setup-node-pnpm@main
      with:
        node-version: ${{ inputs.node-version }}

    # run-lint/run-test são opt-in explícito: script ausente é erro de configuração,
    # não motivo para passar verde (--if-present esconderia um rename/merge ruim).
    - name: Run Lint
      if: ${{ inputs.run-lint == 'true' }}
      shell: bash
      run: |
        node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"           || { echo "::error::run-lint=true mas não existe script \"lint\" no package.json"; exit 1; }
        pnpm lint

    - name: Run Tests
      if: ${{ inputs.run-test == 'true' }}
      shell: bash
      run: |
        node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"           || { echo "::error::run-test=true mas não existe script \"test\" no package.json"; exit 1; }
        pnpm test
